<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>chat_puppy · 小趴</title>
  </head>
  <body>
    <div id="app">
      <!-- 顶部品牌区 -->
      <header class="brand">
        <span class="brand-icon">🐾</span>
        <span class="brand-name">chat_puppy</span>
        <button id="settings-btn" class="settings-btn" title="设置">⚙️</button>
      </header>

      <!-- 中央角色展示区 -->
      <main class="stage">
        <canvas id="avatar" width="340" height="340"></canvas>

        <!-- 对话气泡（浮在角色上方） -->
        <div id="bubble" class="bubble hidden"></div>

        <!-- 状态徽章 -->
        <div id="status" class="status">待机中</div>
      </main>

      <!-- 底部交互控制区 -->
      <footer class="toolbar">
        <button id="start" class="btn btn-primary">
          <span class="btn-icon">🎤</span>
          <span>开始对话</span>
        </button>
        <button id="stop" class="btn btn-secondary" disabled>
          <span class="btn-icon">⏹</span>
          <span>停止</span>
        </button>
      </footer>
    </div>

    <!-- 设置抽屉 -->
    <div id="settings-overlay" class="settings-overlay hidden"></div>
    <aside id="settings-panel" class="settings-panel hidden">
      <div class="settings-header">
        <h2>设置</h2>
        <button id="settings-close" class="settings-close">✕</button>
      </div>

      <div class="settings-body">
        <!-- 音色 -->
        <section class="settings-group">
          <label class="settings-label" for="voice-select">音色</label>
          <select id="voice-select" class="settings-select"></select>
        </section>

        <!-- 人设 -->
        <section class="settings-group">
          <label class="settings-label">人设</label>
          <div class="persona-presets">
            <button class="persona-chip" data-persona="cute">软萌治愈</button>
            <button class="persona-chip" data-persona="energetic">元气活泼</button>
            <button class="persona-chip" data-persona="tsundere">傲娇</button>
          </div>
          <textarea id="persona-input" class="settings-textarea" rows="5" placeholder="自定义小趴的人设…"></textarea>
        </section>

        <!-- 清空记忆 -->
        <section class="settings-group">
          <button id="clear-memory" class="btn-danger">清空对话记忆</button>
        </section>
      </div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
